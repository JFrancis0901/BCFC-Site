<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>Chat | BCFC Workers</title>

<link
  rel="stylesheet"
  href="portal.css">

<link
  rel="stylesheet"
  href="board.css">

<style>

/* ==========================================================
   CHAT TABS
   ========================================================== */

.chat-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
  margin-bottom:1rem;
}

.chat-tabs button{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  padding:.45rem .7rem;
  border-radius:6px;
  cursor:pointer;
  font:600 .8rem var(--body);
}

.chat-tabs button:hover{
  border-color:var(--gold);
}

.chat-tabs button.on{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}


/* ==========================================================
   ADMIN TOOLS
   ========================================================== */

.chat-admin-tools{
  display:flex;
  justify-content:flex-end;
  margin-bottom:1rem;
}

.btn-clear-chat{
  border:0;
  border-radius:6px;
  padding:.6rem .9rem;
  background:var(--scarlet);
  color:#fff;
  font:600 .85rem var(--body);
  cursor:pointer;
}

.btn-clear-chat:hover{
  background:#8f0e21;
}

.btn-clear-chat:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* ==========================================================
   CHAT BOX
   ========================================================== */

.chat-box{
  min-height:420px;
  max-height:65vh;
  overflow-y:auto;

  display:flex;
  flex-direction:column;
  gap:.7rem;

  padding:1rem;

  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
}


/* ==========================================================
   MESSAGE
   ========================================================== */

.msg{
  align-self:flex-start;
  max-width:80%;

  background:#f1eff6;

  border-radius:8px;

  padding:.65rem .8rem;

  position:relative;
}

.msg.mine{
  align-self:flex-end;
  background:#e8edf9;
}

.msg small{
  display:block;
  font-size:.72rem;
  font-weight:600;
  color:#6c6880;
  margin-bottom:.2rem;
}

.msg span{
  display:block;
  word-break:break-word;
  white-space:pre-wrap;
}


/* ==========================================================
   MESSAGE ACTIONS
   ========================================================== */

.msg-actions{
  display:flex;
  gap:.4rem;
  margin-top:.45rem;
}

.msg-actions button{
  border:0;
  background:none;
  padding:.15rem .3rem;
  cursor:pointer;
  font:600 .72rem var(--body);
  color:#6c6880;
}

.msg-actions button:hover{
  color:var(--navy);
}

.msg-actions .msg-delete:hover{
  color:var(--scarlet);
}

.msg-actions .msg-edit:hover{
  color:var(--blue);
}


/* ==========================================================
   EDIT MESSAGE
   ========================================================== */

.msg-edit-box{
  width:100%;
  margin-top:.4rem;
  padding:.5rem .6rem;
  border:2px solid var(--gold);
  border-radius:6px;
  font:inherit;
  resize:vertical;
  min-height:70px;
}

.msg-edit-actions{
  display:flex;
  gap:.4rem;
  margin-top:.4rem;
}

.msg-edit-actions button{
  border:0;
  border-radius:5px;
  padding:.35rem .6rem;
  cursor:pointer;
  font:600 .72rem var(--body);
}

.msg-save{
  background:var(--navy);
  color:#fff;
}

.msg-cancel{
  background:#fff;
  border:1px solid var(--line)!important;
  color:var(--ink);
}


/* ==========================================================
   SEND MESSAGE
   ========================================================== */

.chat-form{
  display:flex;
  gap:.6rem;
  margin-top:1rem;
}

.chat-form input{
  flex:1;
  min-width:0;
  padding:.75rem .9rem;
  border:2px solid var(--line);
  border-radius:6px;
  font:inherit;
}

.chat-form input:focus{
  outline:none;
  border-color:var(--gold);
}

.chat-form button{
  padding:.75rem 1.2rem;
  border:0;
  border-radius:6px;
  background:var(--navy);
  color:#fff;
  font:600 .9rem var(--body);
  cursor:pointer;
}

.chat-form button:hover{
  background:var(--purple);
}


/* ==========================================================
   MOBILE
   ========================================================== */

@media (max-width:600px){

  .chat-form{
    flex-direction:column;
  }

  .chat-form button{
    width:100%;
  }

  .msg{
    max-width:90%;
  }

}

</style>

</head>


<body>


<header
  class="portal-header"
  id="portal-header">
</header>


<main class="board-page">


  <h1 id="page-title">
    Chat
  </h1>


  <p
    id="page-note"
    class="page-note">
    Chat with the workers who have access to each channel.
  </p>


  <!-- ADMIN CLEAR BUTTON -->

  <div
    id="chat-admin-tools"
    class="chat-admin-tools"
    hidden>

    <button
      type="button"
      id="clear-chat-btn"
      class="btn-clear-chat">

      Clear Entire Chat

    </button>

  </div>


  <!-- CHANNELS -->

  <div
    id="chat-tabs"
    class="chat-tabs">
  </div>


  <!-- MESSAGES -->

  <div
    id="chat-box"
    class="chat-box">
  </div>


  <!-- SEND -->

  <form
    id="chat-form"
    class="chat-form">

    <input
      id="chat-input"
      maxlength="500"
      placeholder="Type a message"
      autocomplete="off">

    <button
      type="submit">

      Send

    </button>

  </form>


</main>


<script type="module">

/* ==========================================================
   PORTAL
   ========================================================== */

import "./portal.js";


/* ==========================================================
   FIRESTORE
   ========================================================== */

import {

  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  getDocs,
  onSnapshot,
  query,
  where,
  serverTimestamp,
  writeBatch

} from
"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";


/* ==========================================================
   FIREBASE
   ========================================================== */

import {
  auth,
  db
} from "./firebase-config.js";


/* ==========================================================
   SAFE TEXT
   ========================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>\"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      }[char])
    );

}


/* ==========================================================
   CHANNELS
   ========================================================== */

const CH = {

  general:"General",

  leads:"Department Leads",

  preaching:"Preaching Team",

  childrens:"Children's Church",

  ufy:"UFY",

  ufw:"UFW",

  ufm:"UFM",

  production:"Production",

  creatives:"Creatives"

};


/* ==========================================================
   CHANNEL ACCESS
   ========================================================== */

function allowed(role){

  if(role === "admin"){

    return Object.keys(CH);

  }


  return Object.keys(CH).filter(
    channel =>

      channel === "general"

      ||

      channel ===
      role?.replace(
        "-lead",
        ""
      )

      ||

      (
        channel === "leads"

        &&

        (
          role?.endsWith("-lead")
          ||
          role === "pastor"
        )
      )

      ||

      (
        channel === "preaching"

        &&

        (
          role === "pastor"
          ||
          role === "preaching"
        )
      )

  );

}


/* ==========================================================
   ELEMENTS
   ========================================================== */

const tabs =
  document.getElementById(
    "chat-tabs"
  );

const box =
  document.getElementById(
    "chat-box"
  );

const form =
  document.getElementById(
    "chat-form"
  );

const input =
  document.getElementById(
    "chat-input"
  );

const clearChatBtn =
  document.getElementById(
    "clear-chat-btn"
  );

const adminTools =
  document.getElementById(
    "chat-admin-tools"
  );


const me = () =>
  auth.currentUser?.uid || "";


/* ==========================================================
   STATE
   ========================================================== */

let currentChannel =
  "general";

let unsubscribe =
  null;


/* ==========================================================
   ADMIN BUTTON
   ========================================================== */

function updateAdminButton(){

  const isAdmin =
    window.currentRole ===
    "admin";

  adminTools.hidden =
    !isAdmin;

}


/* ==========================================================
   OPEN CHANNEL
   ========================================================== */

function openChannel(channel){

  currentChannel =
    channel;


  if(unsubscribe){

    unsubscribe();

    unsubscribe =
      null;

  }


  const channels =
    allowed(
      window.currentRole
    );


  if(
    !channels.includes(
      currentChannel
    )
  ){

    currentChannel =
      channels.includes(
        "general"
      )

      ? "general"

      : channels[0];

  }


  tabs.innerHTML =
    channels
    .map(
      key => `

        <button
          type="button"
          data-channel="${key}"
          class="${key === currentChannel ? "on" : ""}">

          ${esc(CH[key])}

        </button>

      `
    )
    .join("");


  updateAdminButton();


  if(!currentChannel){

    box.innerHTML = `
      <p class="page-note">
        No chat channels are available.
      </p>
    `;

    return;

  }


  const chatQuery =
    query(
      collection(
        db,
        "messages"
      ),
      where(
        "channel",
        "==",
        currentChannel
      )
    );


  unsubscribe =
    onSnapshot(

      chatQuery,

      snapshot => {

        const messages =
          snapshot.docs
          .map(
            messageDoc => ({

              id:
                messageDoc.id,

              ...messageDoc.data()

            })
          )
          .sort(
            (a,b) =>
              (
                a.createdAt?.seconds
                ??
                0
              )
              -
              (
                b.createdAt?.seconds
                ??
                0
              )
          );


        if(!messages.length){

          box.innerHTML = `
            <p class="page-note">
              No messages yet. Say hello!
            </p>
          `;

          return;

        }


        box.innerHTML =
          messages
          .map(
            message => {

              const mine =
                message.uid ===
                me();

              const admin =
                window.currentRole ===
                "admin";


              const canEdit =
                mine;


              const canDelete =
                mine ||
                admin;


              return `

                <div
                  class="msg${mine ? " mine" : ""}"
                  data-id="${esc(message.id)}">

                  <small>
                    ${esc(
                      message.name ||
                      "Worker"
                    )}
                  </small>


                  <span class="msg-text">
                    ${esc(
                      message.text ||
                      ""
                    )}
                  </span>


                  ${
                    (
                      canEdit ||
                      canDelete
                    )

                    ?

                    `
                      <div
                        class="msg-actions">

                        ${
                          canEdit

                          ?

                          `
                            <button
                              type="button"
                              class="msg-edit"
                              data-edit="${esc(message.id)}">

                              Edit

                            </button>
                          `

                          :

                          ""
                        }


                        ${
                          canDelete

                          ?

                          `
                            <button
                              type="button"
                              class="msg-delete"
                              data-delete="${esc(message.id)}">

                              Delete

                            </button>
                          `

                          :

                          ""
                        }

                      </div>
                    `

                    :

                    ""

                  }

                </div>

              `;

            }
          )
          .join("");


        box.scrollTop =
          box.scrollHeight;

      },

      error => {

        console.error(
          "Chat error:",
          error
        );


        box.innerHTML = `
          <p class="page-note">

            Couldn't load this channel
            (${esc(
              error.code ||
              error.message
            )}).

          </p>
        `;

      }

    );

}


/* ==========================================================
   CHANNEL BUTTONS
   ========================================================== */

tabs.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-channel]"
      );


    if(!button){

      return;

    }


    openChannel(
      button.dataset.channel
    );

  }
);


/* ==========================================================
   DELETE ONE MESSAGE
   ========================================================== */

box.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-delete]"
      );


    if(!button){

      return;

    }


    const messageId =
      button.dataset.delete;


    if(!messageId){

      return;

    }


    if(
      !confirm(
        "Delete this message?"
      )
    ){

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Deleting...";


    try{

      await deleteDoc(
        doc(
          db,
          "messages",
          messageId
        )
      );

    }catch(error){

      console.error(
        "Delete message error:",
        error
      );


      alert(
        `Couldn't delete message (${error.code || error.message}).`
      );


      button.disabled =
        false;

      button.textContent =
        "Delete";

    }

  }
);


/* ==========================================================
   ADMIN CLEAR ENTIRE CHAT
   ========================================================== */

clearChatBtn.addEventListener(
  "click",
  async () => {

    if(
      window.currentRole !==
      "admin"
    ){

      alert(
        "Only an admin can clear the chat."
      );

      return;

    }


    const confirmed =
      confirm(
        "CLEAR ENTIRE CHAT?\n\nThis will permanently delete every message from every channel.\n\nThis cannot be undone."
      );


    if(!confirmed){

      return;

    }


    clearChatBtn.disabled =
      true;

    clearChatBtn.textContent =
      "Clearing...";


    try{

      const snapshot =
        await getDocs(
          collection(
            db,
            "messages"
          )
        );


      if(snapshot.empty){

        alert(
          "The chat is already empty."
        );

        return;

      }


      const documents =
        snapshot.docs;


      /*
        IMPORTANT:
        Keep this at 20 or below.

        Firestore security rules have a
        20-call limit for batched writes.
      */

      const BATCH_SIZE =
        20;


      for(
        let start = 0;
        start < documents.length;
        start += BATCH_SIZE
      ){

        const batch =
          writeBatch(db);


        const group =
          documents.slice(
            start,
            start + BATCH_SIZE
          );


        group.forEach(
          messageDoc => {

            batch.delete(
              doc(
                db,
                "messages",
                messageDoc.id
              )
            );

          }
        );


        await batch.commit();

      }


      alert(
        "The entire chat has been cleared."
      );


    }catch(error){

      console.error(
        "Clear chat error:",
        error
      );


      alert(
        `Couldn't clear the chat (${error.code || error.message}).`
      );


    }finally{

      clearChatBtn.disabled =
        false;

      clearChatBtn.textContent =
        "Clear Entire Chat";

    }

  }
);


/* ==========================================================
   EDIT MESSAGE
   ========================================================== */

box.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-edit]"
      );


    if(!button){

      return;

    }


    const message =
      button.closest(
        ".msg"
      );


    if(!message){

      return;

    }


    const messageId =
      button.dataset.edit;


    const textElement =
      message.querySelector(
        ".msg-text"
      );


    const oldText =
      textElement?.textContent ||
      "";


    textElement.innerHTML = `

      <textarea
        class="msg-edit-box"
        maxlength="500">${esc(oldText)}</textarea>

      <div
        class="msg-edit-actions">

        <button
          type="button"
          class="msg-save"
          data-save-edit="${esc(messageId)}">

          Save

        </button>


        <button
          type="button"
          class="msg-cancel"
          data-cancel-edit>

          Cancel

        </button>

      </div>

    `;


    button.style.display =
      "none";

  }
);


/* ==========================================================
   SAVE EDIT
   ========================================================== */

box.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-save-edit]"
      );


    if(!button){

      return;

    }


    const message =
      button.closest(
        ".msg"
      );


    const textarea =
      message?.querySelector(
        ".msg-edit-box"
      );


    if(
      !message ||
      !textarea
    ){

      return;

    }


    const text =
      textarea.value.trim();


    if(!text){

      alert(
        "Message cannot be empty."
      );

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Saving...";


    try{

      await updateDoc(
        doc(
          db,
          "messages",
          button.dataset.saveEdit
        ),
        {
          text
        }
      );

    }catch(error){

      console.error(
        "Edit message error:",
        error
      );


      alert(
        `Couldn't edit message (${error.code || error.message}).`
      );


      button.disabled =
        false;

      button.textContent =
        "Save";

    }

  }
);


/* ==========================================================
   CANCEL EDIT
   ========================================================== */

box.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-cancel-edit]"
      );


    if(!button){

      return;

    }


    openChannel(
      currentChannel
    );

  }
);


/* ==========================================================
   SEND MESSAGE
   ========================================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const text =
      input.value.trim();


    if(!text){

      return;

    }


    const uid =
      me();


    if(!uid){

      alert(
        "You are not signed in."
      );

      return;

    }


    const name =
      sessionStorage.getItem(
        "bcfc-name"
      )
      ||
      "Worker";


    try{

      await addDoc(
        collection(
          db,
          "messages"
        ),
        {

          channel:
            currentChannel,

          text,

          uid,

          name,

          createdAt:
            serverTimestamp()

        }
      );


      input.value =
        "";

      input.focus();


    }catch(error){

      console.error(
        "Send message error:",
        error
      );


      alert(
        `Couldn't send message (${error.code || error.message}).`
      );

    }

  }
);


/* ==========================================================
   ROLE CHANGE
   ========================================================== */

window.addEventListener(
  "rolechange",
  () => {

    updateAdminButton();


    const channels =
      allowed(
        window.currentRole
      );


    openChannel(

      channels.includes(
        currentChannel
      )

      ? currentChannel

      : "general"

    );

  }
);


/* ==========================================================
   START
   ========================================================== */

auth.authStateReady()
.then(
  () => {

    updateAdminButton();


    const channels =
      allowed(
        window.currentRole
      );


    openChannel(

      channels.includes(
        "general"
      )

      ? "general"

      : channels[0]

    );

  }
);

</script>

</body>
</html>
