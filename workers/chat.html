<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | BCFC Workers</title>
<link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="board.css"></head>
<body>
<header class="portal-header" id="portal-header"></header>
<main class="board-page"><h1 id="page-title">Chat</h1><p id="page-note" class="page-note"></p><div id="chat-tabs" class="chat-tabs"></div><div id="chat-box" class="chat-box"></div><form id="chat-form" class="chat-form"><input id="chat-input" maxlength="500" placeholder="Type a message" autocomplete="off"><button>Send</button></form></main>
<script type="module">
import "./portal.js";
import { collection, addDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { auth, db } from "./firebase-config.js";
import { esc } from "./board.js";
const CH = { general: 'General', leads: 'Department Leads', preaching: 'Preaching Team', childrens: "Children's Church",
  ufy: 'UFY', ufw: 'UFW', ufm: 'UFM', production: 'Production', creatives: 'Creatives' };
const allowed = r => r === 'admin' ? Object.keys(CH) : Object.keys(CH).filter(c => c === 'general' || c === r.replace('-lead', '')
  || (c === 'leads' && (r.endsWith('-lead') || r === 'pastor')) || (c === 'preaching' && ['pastor', 'preaching'].includes(r)));
let ch = 'general', unsub = null;
const tabs = document.getElementById('chat-tabs'), box = document.getElementById('chat-box'), form = document.getElementById('chat-form'), input = document.getElementById('chat-input');
const me = () => auth.currentUser?.uid;

function open(c) {
  ch = c; unsub && unsub();
  tabs.innerHTML = allowed(window.currentRole).map(k => `<button data-c="${k}" class="${k === ch ? 'on' : ''}">${esc(CH[k])}</button>`).join('');
  unsub = onSnapshot(query(collection(db, 'messages'), where('channel', '==', ch)), snap => {
    const msgs = snap.docs.map(d => d.data()).sort((a, b) => (a.createdAt?.seconds ?? 9e9) - (b.createdAt?.seconds ?? 9e9));
    box.innerHTML = msgs.length ? msgs.map(m => `<div class="msg${m.uid === me() ? ' mine' : ''}"><small>${esc(m.name || 'Worker')}</small><span>${esc(m.text)}</span></div>`).join('')
      : '<p class="page-note">No messages yet. Say hello!</p>';
    box.scrollTop = box.scrollHeight;
  }, e => { console.error(e); box.innerHTML = `<p class="page-note">Couldn't load this channel (${esc(e.code || e.message)}). Publish the latest firestore.rules and make sure your account has a users document.</p>`; });
}
tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) open(b.dataset.c); });
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  try { await addDoc(collection(db, 'messages'), { channel: ch, text, uid: me() || '', name: sessionStorage.getItem('bcfc-name') || 'Worker', createdAt: serverTimestamp() }); }
  catch (err) { console.error(err); alert(`Couldn't send (${err.code || err.message}). You may not have access to this channel.`); }
});
window.addEventListener('rolechange', () => open(allowed(window.currentRole).includes(ch) ? ch : 'general'));
auth.authStateReady().then(() => open('general'));   // wait until Firebase knows who is signed in
</script></body></html>
