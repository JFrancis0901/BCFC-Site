<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources | BCFC Workers</title>
<link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="board.css">
<style>
.res-cat{margin:28px 0 12px;font-size:1.15rem;color:var(--blue);border-bottom:2px solid var(--gold);padding-bottom:6px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;box-shadow:0 4px 14px #0000000a}
.res-card h3{margin:10px 0 6px;font-size:1.02rem}
.res-card p{margin:0 0 14px;color:#666;font-size:.88rem;line-height:1.5;flex:1}
.res-type{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:6px;background:#eef2ff;color:var(--blue)}
.res-pptx,.res-ppt{background:#fdeadf;color:#b4410e}.res-pdf{background:#fde4e6;color:var(--scarlet)}
.res-docx,.res-doc{background:#e3edfb;color:#1f55b5}.res-xlsx,.res-xls,.res-csv{background:#e1f4e6;color:#1a7a3a}
.res-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.res-foot small{color:#888}
.res-btn{background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;padding:.5rem 1rem;border-radius:6px}
.res-btn:hover{background:var(--blue)}
#resource-status{color:#666}
</style></head>
<body>
<header class="portal-header" id="portal-header"></header>
<main class="board-page"><h1>Resources</h1>
<p class="page-note">Files and templates for BCFC workers. Click Download to save a file to your device.</p>
<p id="resource-status" role="status">Loading resources…</p>
<div id="resource-list"></div></main>
<script type="module" src="resources.js"></script>
</body></html>
