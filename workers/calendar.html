<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>Calendar | BCFC Workers</title>

<link
  rel="stylesheet"
  href="portal.css">

<link
  rel="stylesheet"
  href="calendar.css">

</head>


<body>


<!-- WORKERS HEADER -->

<header
  class="portal-header"
  id="portal-header">
</header>


<!-- =====================================================
     CALENDAR
     ===================================================== -->

<main class="calendar-page">


  <!-- CALENDAR GRID -->

  <section class="calendar-main">

    <div class="calendar-toolbar">

      <button
        id="prev-month"
        aria-label="Previous month">
        &#8249;
      </button>

      <h1 id="month-label">
        Month Year
      </h1>

      <button
        id="next-month"
        aria-label="Next month">
        &#8250;
      </button>

      <button
        id="today-btn"
        class="btn-today">
        Today
      </button>

    </div>


    <div class="legend">

      <span>
        <i class="dot dot-sunday"></i>
        Sunday Service
      </span>

      <span>
        <i class="dot dot-nurture"></i>
        Family Nurture
      </span>

      <span>
        <i class="dot dot-prayer"></i>
        Abound in Prayer
      </span>

      <span>
        <i class="dot dot-childrens"></i>
        Children's Church
      </span>

      <span>
        <i class="dot dot-ufy"></i>
        UFY
      </span>

      <span>
        <i class="dot dot-ufw"></i>
        UFW
      </span>

      <span>
        <i class="dot dot-ufm"></i>
        UFM
      </span>

      <span>
        <i class="dot dot-production"></i>
        Production
      </span>

      <span>
        <i class="dot dot-creatives"></i>
        Creatives
      </span>

      <span>
        <i class="dot dot-other"></i>
        Other
      </span>

    </div>


    <div class="weekday-row">

      <span>Sun</span>
      <span>Mon</span>
      <span>Tue</span>
      <span>Wed</span>
      <span>Thu</span>
      <span>Fri</span>
      <span>Sat</span>

    </div>


    <div
      id="calendar-grid"
      class="calendar-grid">
    </div>

  </section>


  <!-- SELECTED DAY -->

  <aside class="day-panel">

    <h2 id="day-panel-title">
      Select a day
    </h2>

    <ul
      id="day-panel-list"
      class="day-panel-list">
    </ul>

    <button
      class="btn-add-event"
      id="add-event-btn">
      + Add Activity
    </button>

  </aside>

</main>


<!-- =====================================================
     ADD ACTIVITY DIALOG
     ===================================================== -->

<dialog
  id="event-dialog"
  class="event-dialog">

  <form
    id="event-form"
    method="dialog">

    <h2>
      Add Activity
    </h2>


    <p
      id="event-error"
      class="event-error"
      hidden>
    </p>


    <label for="evt-title">
      Title
    </label>

    <input
      id="evt-title"
      required
      maxlength="80">


    <label for="evt-module">
      Category
    </label>

    <select
      id="evt-module"
      required>
    </select>


    <div class="row2">

      <div>

        <label for="evt-date">
          Date
        </label>

        <input
          type="date"
          id="evt-date"
          required>

      </div>


      <div>

        <label for="evt-time">
          Time
        </label>

        <input
          type="time"
          id="evt-time">

      </div>

    </div>


    <div
      id="preacher-row"
      hidden>

      <label for="evt-preacher">
        Preacher
      </label>

      <input
        id="evt-preacher"
        list="preacher-list"
        maxlength="60"
        placeholder="Assign a preaching staff">

      <datalist
        id="preacher-list">
      </datalist>

    </div>


    <label for="evt-notes">
      Notes (optional)
    </label>

    <textarea
      id="evt-notes"
      rows="3"
      maxlength="300">
    </textarea>


    <div class="dialog-actions">

      <button
        type="button"
        id="evt-cancel"
        class="btn-cancel">
        Cancel
      </button>

      <button
        type="submit"
        id="evt-save"
        class="btn-add-event">
        Save
      </button>

    </div>

  </form>

</dialog>


<!-- =====================================================
     NAME SETUP OVERLAY
     This blocks the whole dashboard until the user
     enters their name.
     ===================================================== -->

<div
  id="profile-setup-overlay"
  class="profile-setup-overlay"
  hidden>

  <div
    class="profile-setup-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="profile-setup-title">

    <div class="profile-setup-icon">
      BCFC
    </div>


    <h2 id="profile-setup-title">
      Welcome to the Workers Portal
    </h2>


    <p class="profile-setup-text">
      Before you can use the dashboard, please enter your full name.
    </p>


    <form
      id="profile-setup-form"
      novalidate>

      <label for="profile-setup-name">
        Full name
      </label>

      <input
        type="text"
        id="profile-setup-name"
        maxlength="60"
        autocomplete="name"
        required
        placeholder="Enter your full name">


      <p
        id="profile-setup-error"
        class="profile-setup-error"
        role="alert"
        hidden>
      </p>


      <button
        type="submit"
        id="profile-setup-btn"
        class="profile-setup-btn">
        Continue
      </button>

    </form>

  </div>

</div>


<script
  type="module"
  src="portal.js">
</script>

<script
  type="module"
  src="calendar.js">
</script>


</body>
</html>
