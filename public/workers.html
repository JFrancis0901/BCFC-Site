<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workers | BCFC</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script><script src="clean-urls.js" defer></script></head>
<body class="t-blue"><div id="site-header"></div><main>
<section class="hero-left"><p class="script">The people behind the ministry</p><h1>Our <em>Workers</em></h1><p>Choose a ministry to see its leaders and workers.</p></section>

</main><div id="site-footer"></div>
<style>.ministry-selected{outline:3px solid #dca51c}.team-person{text-align:center;padding:1rem;border:1px solid #ddd;background:white}.team-person img{width:88px;height:88px;object-fit:contain}.team-person h3{margin:.5rem 0}.team-role{display:inline-block;padding:.25rem .6rem;background:#142044;color:white;border-radius:20px;font-size:.85rem}</style>
