<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizational Chart | BCFC</title>
<link rel="stylesheet" href="style.css">
<script src="photos.js"></script><script src="script.js" defer></script><script src="clean-urls.js" defer></script>
<style>
.org-intro{max-width:820px;margin:0 auto 30px;text-align:center}.org-status{padding:18px;border-radius:12px;background:#f5f2ea;text-align:center;color:#555}.org-tree{display:flex;flex-direction:column;align-items:center;gap:22px}.org-level{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;width:100%}.org-connector{width:2px;height:24px;background:rgba(30,58,138,.28)}.org-node{width:min(240px,calc(100vw - 60px));background:#fff;border:1px solid #e5e0d5;border-radius:14px;padding:18px 16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}.org-photo{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:#fff;border:3px solid #d5a928;display:grid;place-items:center;overflow:hidden}.org-photo img{width:100%;height:100%;object-fit:contain}.foursquare-mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:38px;height:38px}.foursquare-mark span{background:#23469b}.foursquare-mark span:nth-child(3){grid-column:1 / span 2;width:19px;justify-self:center}.org-node h3{margin:0 0 5px;font-size:1.02rem}.org-node p{margin:0;color:#666;font-size:.88rem}.org-role{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#23469b;font-size:.76rem;font-weight:700}.org-empty{max-width:650px;margin:auto;text-align:center;padding:28px;border-radius:12px;background:#f7f7f7;color:#666}.org-note{margin-top:25px;font-size:.85rem;color:#777;text-align:center}
</style>
</head>
<body class="t-blue">
<div id="site-header"></div>
<main>
<section class="hero-strip"><p class="script">How we serve together</p><h1>Organizational <em>Chart</em></h1></section>
<section class="band b-ivory">
  <div class="org-intro"><p>The BCFC organizational chart is maintained through the Workers portal. It shows the current approved ministry structure.</p></div>
  <div id="org-chart" class="org-tree"><div class="org-status">Loading organizational chart...</div></div>
  <p class="org-note">Photos can be added later. For now, each position uses the Foursquare logo.</p>
</section>
<section class="band b-gold center"><a class="btn btn-dark" href="about">Back to About BCFC</a></section>
</main>
<div id="site-footer"></div>
<script type="module">
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db } from "../workers/firebase-config.js";
const chart=document.getElementById('org-chart');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={admin:'Admin',pastor:'Pastor',preaching:'Preaching Staff','childrens-lead':"Children's Church Lead",childrens:"Children's Church Worker",'ufy-lead':'UFY Lead',ufy:'UFY Worker','ufw-lead':'UFW Lead',ufw:'UFW Worker','ufm-lead':'UFM Lead',ufm:'UFM Worker','production-lead':'Production Lead',production:'Production Worker','creatives-lead':'Creatives Lead',creatives:'Creatives Worker'};
const parentRole={admin:null,pastor:'admin',preaching:'pastor','childrens-lead':'pastor','ufy-lead':'pastor','ufw-lead':'pastor','ufm-lead':'pastor','production-lead':'pastor','creatives-lead':'pastor',childrens:'childrens-lead',ufy:'ufy-lead',ufw:'ufw-lead',ufm:'ufm-lead',production:'production-lead',creatives:'creatives-lead'};
const order=['admin','pastor','preaching','childrens-lead','childrens','ufy-lead','ufy','ufw-lead','ufw','ufm-lead','ufm','production-lead','production','creatives-lead','creatives'];
function logo(){return '<div class="foursquare-mark" aria-hidden="true"><span></span><span></span><span></span></div>';}
function node(d){const name=d.name||'Unnamed';return `<article class="org-node"><div class="org-photo">${logo()}</div><h3>${esc(name)}</h3><p>${esc(d.title||labels[d.role]||d.role||'Ministry')}</p><span class="org-role">${esc(labels[d.role]||d.role||'')}</span></article>`;}
try{
 const snap=await getDocs(collection(db,'orgChart'));
 const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.active!==false);
 if(!docs.length){chart.innerHTML='<div class="org-empty">The organizational chart has not been published yet. An administrator can publish the current structure from the Workers portal.</div>';} else {
   const byRole={}; docs.forEach(d=>(byRole[d.role]??=[]).push(d));
   const levels=[];
   for(const role of order){ if(!byRole[role]?.length) continue; levels.push({role,items:byRole[role]}); }
   chart.innerHTML=levels.map((level,i)=>`${i?'<div class="org-connector"></div>':''}<div class="org-level" data-role="${esc(level.role)}">${level.items.map(node).join('')}</div>`).join('');
 }
}catch(e){console.error(e);chart.innerHTML='<div class="org-empty">The organizational chart is temporarily unavailable.</div>';}
</script>
</body></html>
